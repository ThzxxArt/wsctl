[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsctl"
version = "0.1.29"
description = "单机部署的 Web 在线终端：多会话、多用户 RBAC、审计、分享、录制与可观测，ttyd 的现代 Python 超集。"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ThzxxArt" }]
keywords = ["terminal", "web", "ttyd", "pty", "websocket", "xterm", "shell"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pyotp>=2.9",
    "segno>=1.6",
    "websockets>=13",
    # ``wsctl serve --tls-self-signed`` is advertised as one command, so it
    # cannot depend on something a plain install does not have. It *did*: this
    # was in the ``dev`` extra only (for CI type checking), and Windows ships no
    # ``openssl`` on PATH either, so on a default install both backends were
    # missing and HTTPS simply refused to start. Wheels exist for every platform
    # wsctl supports, and the openssl fallback is kept for the rest.
    "cryptography>=42",
]

[project.optional-dependencies]
win = ["pywinpty>=2.0"]
e2e = ["playwright>=1.44"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/ThzxxArt/wsctl"
Repository = "https://github.com/ThzxxArt/wsctl"
Issues = "https://github.com/ThzxxArt/wsctl/issues"
Changelog = "https://github.com/ThzxxArt/wsctl/blob/main/CHANGELOG.md"

[project.scripts]
wsctl = "wsctl.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wsctl"]

[tool.hatch.build.targets.sdist]
include = [
    "src/wsctl",
    "tests",
    "scripts",
    "contrib",
    "docs",
    ".dockerignore",
    "DESIGN.md",
    "README.md",
    "SECURITY.md",
    "THIRD_PARTY_NOTICES.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001-003 flag full-width CJK punctuation as "ambiguous"; the project's
# user-facing strings are intentionally Chinese.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses call expressions in defaults by design.
"src/wsctl/server/**.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/wsctl"]

[[tool.mypy.overrides]]
# ``cryptography`` ships as a normal dependency, but ``core.tls`` still treats
# it as *optional* at runtime: it falls back to the ``openssl`` command line
# and says so when neither is available. An install that deliberately skipped
# dependencies (``--no-deps``, a stripped image) must still be able to run
# ``mypy src``, so the import is declared optional here too. When the package
# *is* present -- which is the normal case -- this override does nothing and
# the module is type-checked as usual.
module = ["cryptography", "cryptography.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
timeout = 120
markers = [
    "slow: heavier tests, run with -m slow (skipped by default)",
    "browser: Playwright browser tests, run with -m browser (skipped by default)",
]
