[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsctl"
version = "0.2.0"
description = "单机部署的 Web 终端工作台：可恢复协议、多会话、多用户 RBAC、审计、分享、录制与可观测。"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ThzxxArt" }]
keywords = ["terminal", "web", "pty", "websocket", "xterm", "shell", "workspace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pyotp>=2.9",
    "segno>=1.6",
    # ``additional_headers`` was added in websockets 14; the CLI always passes
    # it, so a 13.x resolution would fail only on a user's machine.
    "websockets>=14",
    # ``wsctl serve --tls-self-signed`` is advertised as one command, so it
    # cannot depend on something a plain install does not have.
    "cryptography>=42",
    # -- 0.2.0 platform ---------------------------------------------------
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "limits>=3.13",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "watchfiles>=0.22",
    "psutil>=6.0",
    "pyte>=0.8",
    "sse-starlette>=2.1",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
win = ["pywinpty>=2.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "schemathesis>=3.30",
    "httpx>=0.27",
    "build>=1.2",
    "twine>=5.1",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.1",
]

[project.urls]
Homepage = "https://github.com/ThzxxArt/wsctl"
Repository = "https://github.com/ThzxxArt/wsctl"
Issues = "https://github.com/ThzxxArt/wsctl"
Changelog = "https://github.com/ThzxxArt/wsctl/blob/main/CHANGELOG.md"

[project.scripts]
wsctl = "wsctl.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wsctl"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "wsctl/THIRD_PARTY_NOTICES.md"
"LICENSE" = "wsctl/LICENSE"

[tool.hatch.build.targets.sdist]
include = [
    "src/wsctl",
    "web",
    "tests",
    "scripts",
    "contrib",
    "docs",
    ".dockerignore",
    "DESIGN.md",
    "README.md",
    "SECURITY.md",
    "THIRD_PARTY_NOTICES.md",
    "LICENSE",
    "CHANGELOG.md",
    "uv.lock",
]
exclude = [
    "web/node_modules",
    "web/test-results",
    "web/playwright-report",
    "web/dist",
    "web/.e2e-data",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001-003 flag full-width CJK punctuation as "ambiguous"; the project's
# user-facing strings are intentionally Chinese.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection uses call expressions in defaults by design.
"src/wsctl/server/**.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/wsctl"]

[[tool.mypy.overrides]]
# ``cryptography`` ships as a normal dependency, but ``core.tls`` still treats
# it as *optional* at runtime: it falls back to the ``openssl`` command line
# and says so when neither is available. An install that deliberately skipped
# dependencies (``--no-deps``, a stripped image) must still be able to run
# ``mypy src``, so the import is declared optional here too. When the package
# *is* present -- which is the normal case -- this override does nothing and
# the module is type-checked as usual.
module = ["cryptography", "cryptography.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyte", "pyte.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
timeout = 120
markers = [
    "slow: heavier tests, run with -m slow (skipped by default)",
    "browser: Playwright browser tests, run with -m browser (skipped by default)",
    "protocol: protocol v2 codec and state-machine tests",
    "migration: database/config migration tests",
    "perf: performance budget tests",
]
