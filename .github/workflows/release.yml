name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify tag matches version
        run: |
          python - <<'PY'
          import os, tomllib, pathlib, re
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', pathlib.Path("src/wsctl/__init__.py").read_text()).group(1)
          web = __import__("json").loads(pathlib.Path("web/package.json").read_text())["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert version == init == web, f"version drift: pyproject={version} init={init} web={web}"
          assert tag == version, f"tag {tag} != version {version}"
          PY
      - name: Frontend build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test
          pnpm build
          git diff --exit-code -- ../src/wsctl/static
          test -z "$(git status --porcelain -- ../src/wsctl/static)"
      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update && sudo apt-get install -y tmux lrzsz
      - name: Verify
        run: |
          ruff check .
          mypy src
          pytest
          pytest -m slow -q --timeout=240
          python scripts/e2e/run_all.py
      - name: Browser tests
        working-directory: web
        env:
          CI: "true"
          WSCTL_PYTHON: python
        run: |
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm exec playwright test
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o dist/wsctl-${{ github.ref_name }}-sbom.json
      - name: Sign artifacts
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Keep only PyPI distributions
        run: |
          # sigstore bundles are release assets, not Python distributions.
          # The publish action treats every file in packages-dir as a package.
          find dist -maxdepth 1 -type f \
            ! -name '*.whl' ! -name '*.tar.gz' -delete
          ls -lh dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
