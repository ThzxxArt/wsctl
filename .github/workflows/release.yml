name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify tag matches version
        run: |
          python - <<'PY'
          import os, tomllib, pathlib, re
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', pathlib.Path("src/wsctl/__init__.py").read_text()).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert version == init, f"pyproject {version} != __init__ {init}"
          assert tag == version, f"tag {tag} != version {version}"
          PY
      - name: Frontend build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build
      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify
        run: |
          ruff check .
          mypy src
          pytest
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o dist/wsctl-${{ github.ref_name }}-sbom.json
      - name: Sign artifacts
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
