name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # One macOS leg: catches POSIX assumptions Linux hides.
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -n auto

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint and format
        working-directory: web
        run: |
          pnpm lint
          pnpm format:check
      - name: Type check
        working-directory: web
        run: pnpm typecheck
      - name: Verify generated API types
        working-directory: web
        run: |
          pnpm api:generate
          git diff --exit-code -- src/api/schema.d.ts openapi.json
      - name: Unit tests
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build
      - name: Bundle budget
        working-directory: web
        run: |
          python - <<'PY'
          import gzip, pathlib
          files = sorted(pathlib.Path("../src/wsctl/static/assets").glob("*.js"))
          total = 0
          for path in files:
              if path.name.startswith(("editor-", "replay-", "zmodem.js-", "AdminDialog-", "SettingsDialog-", "FilePanel-", "ShareDialog-")):
                  continue
              total += len(gzip.compress(path.read_bytes()))
          print(f"initial JS (gzip): {total/1024:.1f} KiB")
          assert total < 500 * 1024, "initial bundle exceeds 500 KiB gzip"
          PY

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update && sudo apt-get install -y tmux
      - name: Frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        working-directory: web
        env:
          CI: "true"
        run: pnpm exec playwright test

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Load tests
        run: pytest -m slow -q --timeout=240

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update && sudo apt-get install -y tmux lrzsz
      - name: Backend end-to-end scenarios
        run: python scripts/e2e/run_all.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[dev]"
          pip-audit
      - name: Frontend dependency audit
        working-directory: web
        run: pnpm audit --audit-level high
      - name: SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom-python.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-python.json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t wsctl:ci -f contrib/docker/Dockerfile .
      - name: Smoke the image
        run: |
          docker run --rm wsctl:ci version
          docker run --rm -e WSCTL_ADMIN_PASSWORD=ci-password-123 \
            -v "$PWD/ci-data:/data" wsctl:ci doctor
