# wsctl 反向代理示例（TLS 终止 + WebSocket 升级）
#
# 使用前请：
#   1. 将 server_name 与证书路径替换为你的实际值；
#   2. 在 wsctl 配置中设置 trust_proxy = true 与 cookie_secure = true；
#   3. 确认 /ws 的 Upgrade/Connection 头被转发，否则终端无法连接。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name wsctl.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wsctl.example.com;

    ssl_certificate     /etc/letsencrypt/live/wsctl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wsctl.example.com/privkey.pem;

    # 大文件上传（与 file_max_upload 保持一致或更大）
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 终端是长连接，放宽超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
