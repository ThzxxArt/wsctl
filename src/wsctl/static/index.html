<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>wsctl 网页终端</title>
  <link rel="stylesheet" href="/static/vendor/xterm.css" />
  <link rel="stylesheet" href="/static/vendor/asciinema-player.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">wsctl</span>
    <div id="tabs" class="tabs"></div>
    <button id="new-tab" class="icon-btn" title="新建会话">+</button>
    <div class="spacer"></div>
    <span id="connection" class="status">空闲</span>
    <button id="record-btn" class="text-btn" title="开始/停止录制">录制</button>
    <button id="replay-btn" class="text-btn" title="回放录制">回放</button>
    <button id="zmodem-btn" class="text-btn" title="切换 ZMODEM 文件传输（sz/rz）">传输</button>
    <button id="share-btn" class="text-btn" title="分享会话">分享</button>
    <button id="sessions-btn" class="text-btn" title="会话列表">会话</button>
    <button id="settings-btn" class="text-btn" title="设置">设置</button>
    <button id="files-toggle" class="text-btn" title="文件面板">文件</button>
    <span id="whoami" class="whoami"></span>
    <button id="logout" class="text-btn" title="退出登录">退出</button>
  </header>

  <main id="terminal-wrap"></main>

  <div id="tab-menu" class="context-menu hidden">
    <button data-action="detach">关闭标签（保持会话）</button>
    <button data-action="kill">终止会话</button>
  </div>

  <aside id="file-panel" class="file-panel hidden">
    <header class="file-head">
      <span id="file-crumbs" class="crumbs"></span>
      <button id="file-close" class="text-btn" title="关闭">&times;</button>
    </header>
    <div class="file-toolbar">
      <button id="file-upload-btn" class="text-btn">上传</button>
      <button id="file-refresh" class="text-btn">刷新</button>
      <span id="file-status" class="file-status"></span>
      <input id="file-input" type="file" multiple hidden />
    </div>
    <ul id="file-list" class="file-list"></ul>
  </aside>

  <div id="login-overlay" class="overlay hidden">
    <form id="login-form" class="login-card">
      <h1>wsctl</h1>
      <p id="login-error" class="error hidden"></p>
      <label>用户名<input id="username" name="username" autocomplete="username" autofocus /></label>
      <label>密码<input id="password" name="password" type="password" autocomplete="current-password" /></label>
      <label>两步验证码（未启用可留空）<input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code" /></label>
      <button type="submit">登录</button>
    </form>
  </div>

  <div id="share-overlay" class="overlay hidden">
    <div class="login-card share-card">
      <h1>分享会话</h1>
      <p class="share-hint">任何拿到此链接的人都能观看该终端。</p>
      <label class="share-write"><input id="share-write" type="checkbox" /> 允许输入（可写）</label>
      <label>有效期
        <select id="share-ttl">
          <option value="">永久</option>
          <option value="600">10 分钟</option>
          <option value="3600">1 小时</option>
          <option value="86400">1 天</option>
        </select>
      </label>
      <img id="share-qr" alt="分享二维码" />
      <input id="share-url" readonly />
      <div class="share-actions">
        <button id="share-copy" type="button">复制链接</button>
        <button id="share-regenerate" type="button">生成新链接</button>
        <button id="share-revoke" type="button">撤销分享</button>
        <button id="share-close" type="button">关闭</button>
      </div>
      <p id="share-note" class="error hidden"></p>
    </div>
  </div>

  <div id="sessions-overlay" class="overlay hidden">
    <div class="login-card sessions-card">
      <h1>会话列表</h1>
      <p class="share-hint">关闭标签只会断开连接，会话仍在服务器上运行。</p>
      <ul id="sessions-list" class="session-list"></ul>
      <div class="share-actions">
        <button id="sessions-new" type="button">新建会话</button>
        <button id="sessions-close" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div id="settings-overlay" class="overlay hidden">
    <div class="login-card">
      <h1>设置</h1>
      <label>页面主题
        <select id="set-theme">
          <option value="dark">深色</option>
          <option value="light">浅色</option>
        </select>
      </label>
      <label>字号
        <select id="set-fontsize">
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="16">16</option>
          <option value="18">18</option>
        </select>
      </label>
      <div class="hotkey-title">终端主题</div>
      <div id="theme-gallery" class="theme-gallery"></div>
      <details class="custom-theme">
        <summary>自定义主题</summary>
        <input id="custom-theme-name" placeholder="名称" />
        <textarea id="custom-theme-json" rows="3" placeholder='{"background":"#000","foreground":"#fff"}'></textarea>
        <button id="custom-theme-add" type="button" class="text-btn">添加主题</button>
      </details>
      <div class="hotkey-title">快捷键</div>
      <div id="hotkey-list" class="hotkey-list"></div>
      <button id="hotkeys-reset" type="button" class="text-btn">恢复默认快捷键</button>
      <div class="share-actions">
        <button id="settings-close" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div id="replay-overlay" class="overlay hidden">
    <div class="replay-card">
      <div class="replay-head">
        <span>会话录制</span>
        <button id="replay-close" class="text-btn" title="关闭">&times;</button>
      </div>
      <p id="replay-note" class="error hidden"></p>
      <div id="replay-host" class="replay-host"></div>
    </div>
  </div>

  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/addon-fit.js"></script>
  <script src="/static/vendor/addon-web-links.js"></script>
  <script src="/static/vendor/addon-image.js"></script>
  <script src="/static/vendor/zmodem.js"></script>
  <script src="/static/vendor/asciinema-player.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
