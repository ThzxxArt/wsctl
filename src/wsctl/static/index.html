<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>wsctl</title>
  <link rel="stylesheet" href="/static/vendor/xterm.css" />
  <link rel="stylesheet" href="/static/vendor/asciinema-player.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">wsctl</span>
    <div id="tabs" class="tabs"></div>
    <button id="new-tab" class="icon-btn" title="New session">+</button>
    <div class="spacer"></div>
    <span id="connection" class="status">idle</span>
    <button id="record-btn" class="text-btn" title="Start/stop recording">rec</button>
    <button id="replay-btn" class="text-btn" title="Replay recording">replay</button>
    <button id="share-btn" class="text-btn" title="Share session">share</button>
    <button id="settings-btn" class="text-btn" title="Settings">settings</button>
    <button id="files-toggle" class="text-btn" title="Files">files</button>
    <span id="whoami" class="whoami"></span>
    <button id="logout" class="text-btn" title="Sign out">sign out</button>
  </header>

  <main id="terminal-wrap"></main>

  <aside id="file-panel" class="file-panel hidden">
    <header class="file-head">
      <span id="file-crumbs" class="crumbs"></span>
      <button id="file-close" class="text-btn" title="Close">&times;</button>
    </header>
    <div class="file-toolbar">
      <button id="file-upload-btn" class="text-btn">upload</button>
      <button id="file-refresh" class="text-btn">refresh</button>
      <span id="file-status" class="file-status"></span>
      <input id="file-input" type="file" multiple hidden />
    </div>
    <ul id="file-list" class="file-list"></ul>
  </aside>

  <div id="login-overlay" class="overlay hidden">
    <form id="login-form" class="login-card">
      <h1>wsctl</h1>
      <p id="login-error" class="error hidden"></p>
      <label>Username<input id="username" name="username" autocomplete="username" autofocus /></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <div id="share-overlay" class="overlay hidden">
    <div class="login-card share-card">
      <h1>Share session</h1>
      <p class="share-hint">Anyone with this link can watch this terminal.</p>
      <label class="share-write"><input id="share-write" type="checkbox" /> allow typing (read-write)</label>
      <img id="share-qr" alt="Share QR code" />
      <input id="share-url" readonly />
      <div class="share-actions">
        <button id="share-copy" type="button">copy link</button>
        <button id="share-revoke" type="button">revoke</button>
        <button id="share-close" type="button">close</button>
      </div>
      <p id="share-note" class="error hidden"></p>
    </div>
  </div>

  <div id="settings-overlay" class="overlay hidden">
    <div class="login-card">
      <h1>Settings</h1>
      <label>Theme
        <select id="set-theme">
          <option value="dark">dark</option>
          <option value="light">light</option>
        </select>
      </label>
      <label>Font size
        <select id="set-fontsize">
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="16">16</option>
          <option value="18">18</option>
        </select>
      </label>
      <div class="hotkey-title">Shortcuts</div>
      <div id="hotkey-list" class="hotkey-list"></div>
      <button id="hotkeys-reset" type="button" class="text-btn">reset shortcuts</button>
      <div class="share-actions">
        <button id="settings-close" type="button">close</button>
      </div>
    </div>
  </div>

  <div id="replay-overlay" class="overlay hidden">
    <div class="replay-card">
      <div class="replay-head">
        <span>Session recording</span>
        <button id="replay-close" class="text-btn" title="Close">&times;</button>
      </div>
      <p id="replay-note" class="error hidden"></p>
      <div id="replay-host" class="replay-host"></div>
    </div>
  </div>

  <script src="/static/vendor/xterm.js"></script>
  <script src="/static/vendor/addon-fit.js"></script>
  <script src="/static/vendor/addon-web-links.js"></script>
  <script src="/static/vendor/addon-image.js"></script>
  <script src="/static/vendor/zmodem.js"></script>
  <script src="/static/vendor/asciinema-player.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
